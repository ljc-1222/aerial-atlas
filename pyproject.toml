[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "aerial-atlas"
dynamic = ["version"]
description = "A local orthophoto tile viewer with pixel-exact BigTIFF reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Aerial Atlas contributors"}]
dependencies = ["numpy==2.2.6", "Pillow==12.0.0", "rasterio==1.4.4"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Viewers",
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.9"]

[project.scripts]
aerial-atlas = "aerial_atlas.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "aerial_atlas.__version__"}

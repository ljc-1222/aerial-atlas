name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10.11'
          architecture: x64
      - run: python -m pip install -r requirements/build-lock.txt
      - run: python -m pip install --no-deps -e .
      - name: Check release version
        id: version
        shell: python
        run: |
          import os, re
          from aerial_atlas import __version__
          if not re.fullmatch(r"\d+\.\d+\.\d+", __version__):
              raise SystemExit("Invalid application version")
          tag = f"v{__version__}"
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != tag:
              raise SystemExit("Git tag and application version do not match")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\n")
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_repo.py
      - run: python tools/build_portable.py
      - run: python tools/package_release.py
      - run: python tools/verify_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            dist/releases/aerial-atlas-windows-x64.zip
            dist/releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG"
          release-assets/aerial-atlas-windows-x64.zip
          release-assets/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "Aerial Atlas $RELEASE_TAG"
          --notes "Windows x64 portable application for the April, June and August surveys. Extract the complete ZIP and run AerialAtlas.exe. Download survey ZIPs and source TIFFs into images, or choose their download folder in the app; extraction is automatic and April RGB filenames are preserved. No Python installation is required; datasets are not included."
